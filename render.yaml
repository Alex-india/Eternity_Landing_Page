services:
  - type: web
    name: eternity
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEETING_URL
        value: https://cal.com/aryan-raj-eternity/quick-talk
      - key: BREVO_SENDER_NAME
        value: Aryan Raj | ETERNITY
      - key: BREVO_SENDER_EMAIL
        value: harshraj1603@gmail.com
      - key: ADMIN_NOTIFICATION_EMAIL
        value: harshraj1603@gmail.com
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: CREATOR_WHATSAPP_NUMBER
        sync: false
      - key: CREATOR_AGENCY_NAME
        value: Eternity Creator Network
      - key: CREATOR_EMAIL_ENABLED
        value: "false"
      - key: CAL_WEBHOOK_SECRET
        sync: false
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: ADMIN_BASE_URL
        sync: false
      - key: NOTIFY_HOURLY_LIMIT
        value: "20"
